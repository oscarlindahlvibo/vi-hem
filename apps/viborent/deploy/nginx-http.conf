# Steg 1 (före certifikatutvidgning): enbart http + ACME-verifiering. Installeras av install.sh.
server {
    listen 80;
    server_name viborent.se www.viborent.se;
    location /.well-known/acme-challenge/ { root /var/www/viborent.se/html; try_files $uri =404; }
    location / { return 301 https://viborent.se$request_uri; }
}
