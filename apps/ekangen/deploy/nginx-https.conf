# Steg 2 (efter certifikat): ersätter nginx-http.conf. Installeras av install.sh.
server {
    listen 80;
    server_name ekangensvandrarhem.se www.ekangensvandrarhem.se;
    location /.well-known/acme-challenge/ { root /var/www/ekangensvandrarhem.se/html; try_files $uri =404; }
    location / { return 301 https://ekangensvandrarhem.se$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.ekangensvandrarhem.se;
    ssl_certificate /etc/letsencrypt/live/ekangensvandrarhem.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekangensvandrarhem.se/privkey.pem;
    return 301 https://ekangensvandrarhem.se$request_uri;
}
server {
    listen 443 ssl;
    server_name ekangensvandrarhem.se;
    ssl_certificate /etc/letsencrypt/live/ekangensvandrarhem.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekangensvandrarhem.se/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/ekangensvandrarhem.se/html;
    index index.html;

    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / { try_files $uri $uri/ /index.html; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
}
