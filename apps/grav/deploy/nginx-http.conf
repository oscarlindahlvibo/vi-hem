# Steg 1 (före certifikat): svarar på http och låter Let's Encrypt verifiera domänen.
server {
    listen 80;
    server_name gavirserum.se www.gavirserum.se;
    root /var/www/gavirserum.se/html;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://gavirserum.se$request_uri; }
}
