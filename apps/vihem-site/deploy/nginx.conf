# Dedicated public sales site. Never use this for app.vi-hem.se.
server {
    listen 80;
    server_name vi-hem.se www.vi-hem.se;
    return 301 https://vi-hem.se$request_uri;
}
server {
    listen 443 ssl;
    server_name vi-hem.se www.vi-hem.se;
    ssl_certificate /etc/letsencrypt/live/vi-hem.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vi-hem.se/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host = www.vi-hem.se) { return 301 https://vi-hem.se$request_uri; }
    root /var/www/vi-hem.se/html;
    index index.html;
    open_file_cache off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control no-store; }
    location = /sw.js { add_header Cache-Control no-store; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~ /\. { deny all; }
}
