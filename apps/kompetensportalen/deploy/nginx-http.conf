# Steg 1 (före certifikatutvidgning): enbart http + ACME-verifiering. Installeras av install.sh.
server {
    listen 80;
    server_name kompetensportalen.se www.kompetensportalen.se;
    location /.well-known/acme-challenge/ { root /var/www/kompetensportalen.se/html; try_files $uri =404; }
    location / { return 301 https://kompetensportalen.se$request_uri; }
}
