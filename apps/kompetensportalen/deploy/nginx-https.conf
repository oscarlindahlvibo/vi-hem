# Steg 2 (efter certifikat): ersätter nginx-http.conf. Installeras av install.sh.
server {
    listen 80;
    server_name kompetensportalen.se www.kompetensportalen.se;
    location /.well-known/acme-challenge/ { root /var/www/kompetensportalen/html; try_files $uri =404; }
    location / { return 301 https://kompetensportalen.se$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.kompetensportalen.se;
    ssl_certificate /etc/letsencrypt/live/kompetensportalen.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kompetensportalen.se/privkey.pem;
    return 301 https://kompetensportalen.se$request_uri;
}
server {
    listen 443 ssl;
    server_name kompetensportalen.se;
    ssl_certificate /etc/letsencrypt/live/kompetensportalen.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kompetensportalen.se/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/kompetensportalen/html;
    index index.html;

    access_log /var/log/nginx/kompetensportalen.se.access.log;
    error_log /var/log/nginx/kompetensportalen.se.error.log;

    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Stripe tar över via full sidnavigering; video/PDF hämtas från signerade lagrings-URL:er (https) (ingen inbäddning), därför räcker 'self' + API-anrop till Supabase.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com" always;

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/json application/javascript image/svg+xml;

    # Äldre adresser (/shop, /produkt/...) pekas om av appen; nginx släpper igenom allt okänt till SPA:n.
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
}
