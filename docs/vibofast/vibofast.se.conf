server {
    listen 80;
    server_name vibofast.se www.vibofast.se;
    return 301 https://vibofast.se$request_uri;
}
server {
    listen 443 ssl;
    server_name www.vibofast.se;
    ssl_certificate /etc/letsencrypt/live/vibofast.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibofast.se/privkey.pem;
    return 301 https://vibofast.se$request_uri;
}
server {
    listen 443 ssl;
    server_name vibofast.se;
    ssl_certificate /etc/letsencrypt/live/vibofast.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibofast.se/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /var/www/vibofast.se/current;
    index index.html;
    add_header Referrer-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    # Retain existing editorial photos while content is moved to Supabase.
    location ~* ^/wp-content/uploads/(.+\.(?:jpe?g|png|webp|gif|avif))$ {
        alias /var/www/vibofast.se/html/wp-content/uploads/$1;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. {
        deny all;
    }
}
