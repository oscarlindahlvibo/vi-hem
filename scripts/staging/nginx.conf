events {}
http {
  include /etc/nginx/mime.types;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 52m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;
    location = /staging-version.json { try_files $uri =404; }
    # No real billing/dispatch operations in the isolated user test environment.
    location ~ ^/rest/v1/rpc/vihem_(generate_rent_invoices|create_rent_billing_run|queue_invoice_email|queue_rent_run_invoice_emails|queue_overdue_invoice_reminders|schedule_supplier_invoice_payment)$ {
      default_type application/json;
      return 403 '{"code":"QA_DISABLED","message":"Fakturering och utskick är avstängda i staging."}';
    }
    location ~ ^/(auth|rest|storage|functions|realtime)/v1/ {
      proxy_pass http://gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
